name: Build and Test

on:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-dotnet@v6.1.0
      with:
        dotnet-version: '11.0.x'
    - run: dotnet build --configuration Release
    - run: dotnet test --configuration Release --no-build
